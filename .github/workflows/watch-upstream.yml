name: Watch upstream releases

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open PR for a new upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(tr -d '[:space:]' < UPSTREAM_VERSION)"
          latest="$(gh release view -R grimmory-tools/grimmory --json tagName -q .tagName)"
          echo "current=$current latest=$latest"
          [ "$current" != "$latest" ] || { echo "up to date"; exit 0; }

          branch="upstream/$latest"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            # --state all: a closed PR means the bump was rejected; do not reopen it.
            if [ -n "$(gh pr list --head "$branch" --state all --json number -q '.[].number')" ]; then
              echo "branch $branch already has a PR"; exit 0
            fi
            echo "branch $branch exists without a PR (an earlier run failed); finishing it"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$branch"
            echo "$latest" > UPSTREAM_VERSION
            git commit -am "Bump upstream grimmory to $latest"
            git push origin "$branch"
          fi

          # Events from GITHUB_TOKEN don't start workflows, but workflow_dispatch does.
          gh workflow run build.yml --ref "$branch"

          gh pr create --base main --head "$branch" \
            --title "Bump upstream grimmory to $latest" \
            --body "Upstream release notes: https://github.com/grimmory-tools/grimmory/releases/tag/$latest

          The build workflow has been dispatched on this branch (PRs opened with GITHUB_TOKEN do not trigger it on their own). Merge when it is green; merging publishes \`$latest-hardened\` and \`latest-hardened\`."
